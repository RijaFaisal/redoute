[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redoute"
version = "0.1.0"
description = "A local code security auditor: deterministic static analysis plus LLM triage, exploit-validated patching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "bandit>=1.7",
    "pytest>=7",
]

[project.scripts]
redoute = "redoute.cli:main"

[tool.setuptools.packages.find]
include = ["redoute*"]
